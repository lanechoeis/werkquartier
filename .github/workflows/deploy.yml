# 自动部署 Vite + React 项目到 GitHub Pages
name: Deploy to GitHub Pages

on:
  # 只要你推代码到 main 分支，就自动触发部署
  push:
    branches: [main]
  # 也支持手动在GitHub页面触发部署
  workflow_dispatch:

# 部署需要的权限配置
permissions:
  contents: read
  pages: write
  id-token: write

# 避免同时跑多个重复的部署任务
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 第一步：GitHub服务器帮你构建项目
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出你的代码
        uses: actions/checkout@v4
      - name: 配置 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: 安装项目依赖
        run: npm ci
      - name: 构建生产版本
        run: npm run build
      - name: 上传构建好的产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # 第二步：自动部署到 GitHub Pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4